      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is it really free? Do I need to give my card?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your first 15 minutes are free with no signup and no card — just tap Start and begin talking. Create a free account and you get 20 signup credits. You only enter payment details if you decide to buy more credits or subscribe."
            }
          },
          {
            "@type": "Question",
            "name": "My English is very weak. Will I be able to use this?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That is exactly who this is built for. You can speak entirely in Hindi (or Tamil, Telugu, Bengali and 9 others) and your AI coach will help you say it in English, one sentence at a time. Beginners usually start with 3-minute sessions."
            }
          },
          {
            "@type": "Question",
            "name": "How is this different from a free AI chatbot?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is spoken not typed, it switches to your mother tongue when you get stuck, and it tracks a Fluency Score across sessions so you can see improvement."
            }
          },
          {
            "@type": "Question",
            "name": "Will it work on my phone and my data pack?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. It runs in the phone browser with nothing to install. There is an audio-light mode built for patchy 3G and a typical 12-minute session uses less data than a video call."
            }
          },
          {
            "@type": "Question",
            "name": "Can I practise for a specific job or interview?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Interview Ace has role-based mock interviews for HR, Software, Sales, BPO, Banking, Finance, Business Analyst and more."
            }
          },
          {
            "@type": "Question",
            "name": "How do credits work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "One credit is one rupee and covers 12 minutes of live conversation. The minimum top-up is ten rupees, credits never expire, and there is no subscription required."
            }
          },
          {
            "@type": "Question",
            "name": "Is my conversation private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your sessions and account data are handled according to our Privacy Policy. Sessions are private to your account."
            }
          },
          {
            "@type": "Question",
            "name": "Can I cancel? What if it does not work for me?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There is no subscription to cancel on the pay-as-you-go plan. For monthly subscriptions, you can cancel anytime and keep access until the end of the billing period."
            }
          }
