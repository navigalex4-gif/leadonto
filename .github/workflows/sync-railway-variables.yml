name: Sync Railway variables

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type APPLY to write variables to Railway"
        required: true
        default: "DRY_RUN"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-railway-variables.yml"

concurrency:
  group: railway-variables
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Write variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          DRY_RUN: ${{ github.event_name == 'push' || inputs.apply != 'APPLY' }}

          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_ENVIRONMENT: ${{ secrets.CASHFREE_ENVIRONMENT }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          GOOGLE_VERTEX_LOCATION: ${{ secrets.GOOGLE_VERTEX_LOCATION }}
          GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JSEARCH_API_HOST: ${{ secrets.JSEARCH_API_HOST }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::RAILWAY_TOKEN secret is missing."
            exit 1
          fi

          service="${RAILWAY_SERVICE:-leadonto}"
          echo "Target Railway service: $service"

          # Use Railway's native Postgres reference when no GitHub secret is supplied.
          if [[ -z "${DATABASE_URL:-}" ]]; then
            DATABASE_URL='$'
            DATABASE_URL="${DATABASE_URL}{{Postgres.DATABASE_URL}}"
          fi

          keys=(
            ADMIN_PASSWORD_HASH ADZUNA_APP_ID ADZUNA_APP_KEY
            ANTHROPIC_API_KEY ANTHROPIC_BASE_URL
            CASHFREE_APP_ID CASHFREE_ENVIRONMENT CASHFREE_SECRET_KEY
            DATABASE_URL DEEPGRAM_API_KEY FIRECRAWL_API_KEY GEMINI_API_KEY
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL
            GOOGLE_VERTEX_LOCATION GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON
            GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON GROQ_API_KEY
            JSEARCH_API_KEY JSEARCH_API_HOST MISTRAL_API_KEY
            RESEND_API_KEY SESSION_SECRET
          )

          written=0
          skipped=0
          for key in "${keys[@]}"; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "skip $key (no value configured)"
              ((skipped+=1))
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "would write $key"
            else
              railway variables --service "$service" --set "$key=$value" --skip-deploys >/dev/null
              echo "wrote $key"
              ((written+=1))
            fi
          done

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::Dry run complete. $skipped variable(s) were empty."
          else
            echo "::notice::Updated $written variable(s); skipped $skipped empty variable(s)."
          fi
