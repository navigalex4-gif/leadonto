name: Sync Railway variables

# Pushes API credentials from GitHub Secrets into the Railway service so no
# secret value ever lives in this repository.
#
# One-time setup (do this in GitHub, not in the repo):
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Add each secret named in the `env:` block below.
#   2. Add a repository VARIABLE named RAILWAY_SERVICE with your Railway
#      service name (e.g. "leadonto-api").
#   3. Add a repository SECRET named RAILWAY_TOKEN — a Railway *project* token
#      (Railway → Project Settings → Tokens).
#
# Blank/absent secrets are skipped, so you can fill them in gradually.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type APPLY to actually write variables to Railway"
        required: true
        default: "DRY_RUN"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-railway-variables.yml"

concurrency:
  group: railway-variables
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Write variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          DRY_RUN: ${{ github.event_name == 'push' || inputs.apply != 'APPLY' }}

          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_ENVIRONMENT: ${{ secrets.CASHFREE_ENVIRONMENT }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          GOOGLE_VERTEX_LOCATION: ${{ secrets.GOOGLE_VERTEX_LOCATION }}
          GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JSEARCH_API_HOST: ${{ secrets.JSEARCH_API_HOST }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Add a Railway project token."
            exit 1
          fi
          RAILWAY_SERVICE="${RAILWAY_SERVICE:-leadonto}"
          echo "Target Railway service: $RAILWAY_SERVICE"

          # Railway can resolve this service reference itself. This avoids
          # requiring a duplicate DATABASE_URL GitHub secret.
          if [ -z "${DATABASE_URL:-}" ]; then
            DATABASE_URL='

          KEYS="ADMIN_PASSWORD_HASH ADZUNA_APP_ID ADZUNA_APP_KEY ANTHROPIC_API_KEY \
          ANTHROPIC_BASE_URL CASHFREE_APP_ID CASHFREE_ENVIRONMENT CASHFREE_SECRET_KEY \
          DATABASE_URL DEEPGRAM_API_KEY FIRECRAWL_API_KEY GEMINI_API_KEY GOOGLE_CLIENT_ID \
          GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL GOOGLE_VERTEX_LOCATION \
          GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON \
          GROQ_API_KEY JSEARCH_API_KEY JSEARCH_API_HOST MISTRAL_API_KEY \
          RESEND_API_KEY SESSION_SECRET"

          written=0
          skipped=0

          for key in $KEYS; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "skip  $key (no secret value)"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "would write $key (${#value} chars)"
              continue
            fi
            # Value is passed through the environment and quoted, so it never
            # appears in the log or in the process list of a sibling step.
            railway variables --service "$RAILWAY_SERVICE" --set "$key=$value" --skip-deploys >/dev/null
            echo "wrote $key"
            written=$((written + 1))
          done

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run complete. $skipped key(s) missing values. Re-run with apply=APPLY to write."
          else
            echo "::notice::Wrote $written variable(s); skipped $skipped empty secret(s)."
          fi

            DATABASE_URL="${DATABASE_URL}{{Postgres.DATABASE_URL}}"
            echo "Using the Postgres service reference for DATABASE_URL"
          fi

          KEYS="ADMIN_PASSWORD_HASH ADZUNA_APP_ID ADZUNA_APP_KEY ANTHROPIC_API_KEY \
          ANTHROPIC_BASE_URL CASHFREE_APP_ID CASHFREE_ENVIRONMENT CASHFREE_SECRET_KEY \
          DATABASE_URL DEEPGRAM_API_KEY FIRECRAWL_API_KEY GEMINI_API_KEY GOOGLE_CLIENT_ID \
          GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL GOOGLE_VERTEX_LOCATION \
          GOOGLE_VERTEX_SERVICE_ACCOUNT_JSON GOOGLE_CLOUD_TTS_SERVICE_ACCOUNT_JSON \
          GROQ_API_KEY JSEARCH_API_KEY JSEARCH_API_HOST MISTRAL_API_KEY \
          RESEND_API_KEY SESSION_SECRET"

          written=0
          skipped=0

          for key in $KEYS; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "skip  $key (no secret value)"
              skipped=$((skipped + 1))
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "would write $key (${#value} chars)"
              continue
            fi
            # Value is passed through the environment and quoted, so it never
            # appears in the log or in the process list of a sibling step.
            railway variables --service "$RAILWAY_SERVICE" --set "$key=$value" --skip-deploys >/dev/null
            echo "wrote $key"
            written=$((written + 1))
          done

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run complete. $skipped key(s) missing values. Re-run with apply=APPLY to write."
          else
            echo "::notice::Wrote $written variable(s); skipped $skipped empty secret(s)."
          fi
