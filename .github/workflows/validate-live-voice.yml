name: Leadonto Live Voice Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/src/lib/deepgram-live.ts"
      - "artifacts/api-server/src/routes/tts.ts"
      - "artifacts/edubharat/src/lib/use-edge-tts.ts"
      - "artifacts/edubharat/src/pages/english-guru.tsx"
      - ".github/workflows/validate-live-voice.yml"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build shared TypeScript declarations
        run: pnpm run typecheck:libs
      - name: Type-check API server
        run: pnpm --filter "./artifacts/api-server" run typecheck
      - name: Type-check English Guru frontend
        run: pnpm --filter "./artifacts/edubharat" run typecheck
      - name: Build API server
        run: pnpm --filter "./artifacts/api-server" run build
      - name: Build English Guru frontend
        run: pnpm --filter "./artifacts/edubharat" run build
